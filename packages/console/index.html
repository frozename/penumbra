<!doctype html>
<html lang="en" data-theme="sirius">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- connect-src allows loopback in Vite dev mode; launcher rewrites this to connect-src 'self' before serving built assets. style-src 'unsafe-inline' is required for React inline styles + Vite HMR <style> injection. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';" />
    <title>Penumbra console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
