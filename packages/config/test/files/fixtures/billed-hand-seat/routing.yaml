default_roles:
  executor: claude-acp-sonnet
  reviewer: codex-acp-deep
  planner: gemini-acp-pro

role_routing:
  exploration_policy: unsampled-first

personas:
  architect:
    preferred_agent: claude-acp-sonnet
    bias: architect
    system_prompt: Focus on architecture boundaries and sequencing risk.
  simplifier:
    preferred_agent: codex-acp-deep
    bias: simplifier
    system_prompt: Prefer the smallest coherent implementation.
  test-first:
    preferred_agent: codex-acp-deep
    bias: test-first
    system_prompt: Force explicit red-green-refactor progression.
  risk:
    preferred_agent: claude-acp-sonnet
    bias: risk
    system_prompt: Prioritize rollback and failure-mode controls.
  integration:
    preferred_agent: gemini-acp-pro
    bias: integration
    system_prompt: Validate integration boundaries and operational fit.
  security:
    preferred_agent: claude-acp-sonnet
    bias: security
    system_prompt: Prioritize exploitability and boundary correctness.
    category_hints:
      - security
      - auth
      - secrets
  performance:
    preferred_agent: gemini-acp-pro
    bias: performance
    system_prompt: Focus on throughput and latency hazards.
    category_hints:
      - performance
      - scaling
  maintainability:
    preferred_agent: codex-acp-deep
    bias: maintainability
    system_prompt: Minimize long-term complexity and brittle coupling.
  devils_advocate:
    preferred_agent: gemini-acp-pro
    bias: devils_advocate
    system_prompt: Challenge assumptions and expose blind spots.
  simplicity:
    preferred_agent: codex-acp-deep
    bias: simplicity
    system_prompt: Reduce unnecessary moving parts.
  naming_clarity:
    preferred_agent: claude-acp-sonnet
    bias: naming_clarity
    system_prompt: Prioritize naming precision and semantic clarity.
  data_correctness:
    preferred_agent: gemini-acp-pro
    bias: data_correctness
    system_prompt: Validate invariants and data-shape correctness.
  vision_verify:
    preferred_agent: google-gemini-pro-acp
    bias: vision_verify
    system_prompt: "You review UI-touching diffs for SILENT regressions text-focused reviewers miss. Compare removed (-) vs added (+) hunks for: dropped user-visible copy (labels, button text, tooltips, aria-labels, placeholders), removed interactive affordances (onClick/onChange handlers, buttons, links, inputs), and deleted style props or className entries. For each, state whether the removal is intentional (clearly replaced/moved nearby) or a likely silent drop from a refactor; flag silent drops as HIGH. Do not pixel-diff or comment on non-UI logic."
    category_hints: [ui, frontend, styles, copy]
    optional: true

workloads:
  review_adversarial:
    eligible_roles:
      - reviewer
    eligible_agents:
      - architect
      - security
      - performance
    fan_out: 3
    synthesizer: claude-acp-sonnet
  plan_refine:
    eligible_roles:
      - planner
    eligible_agents:
      - architect
      - simplifier
    fan_out: 2
    synthesizer: claude-acp-sonnet
