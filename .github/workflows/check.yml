name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          # Pinned to a known stable release — `latest` can resolve to a canary
          # build, which has surfaced NAPI-teardown panics (exit 133) under load.
          bun-version: 1.3.14
      - name: install ripgrep
        # The fs_grep feature (packages/daemon/src/fs-search.ts) shells out to
        # `rg`, and an import-guard test greps source via `rg`. ripgrep is not
        # preinstalled on the runner, so without this those suites fail to spawn.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: "console (blocking: unit + build)"
        run: |
          bun scripts/bun-test-gate.ts packages/console --path-ignore-patterns='**/e2e/**' --path-ignore-patterns='**/visual/**' --path-ignore-patterns='**/dist/**'
          bun run --cwd packages/console build
      - name: "test (blocking: sharded per package)"
        # Blocking: every shard runs green on the Linux runner since the
        # test-tail fixes of 2026-09-02 (hermetic git fixtures for the depth-1
        # checkout, no dbstat, platform-independent size/time/stat/readdir
        # assumptions, root workspace devDependencies for imports outside
        # packages/). A red shard fails the run. install, typecheck and
        # lint:strict remain hard gates alongside this step.
        #
        # Sharded: each package's tests run in their OWN bun process, plus a final
        # shard for non-package tests (root test/, scripts/). Per-package processes
        # isolate any single crash and keep the per-run logs readable. Each shard
        # goes through scripts/bun-test-gate.ts, which streams the child's output
        # (spawnSync's 1 MiB pipe buffer used to kill the daemon and core shards
        # before their summary) and gates on reported pass/fail, tolerating the
        # known post-summary NAPI-teardown panic (exit 133) only when 0 failures.
        #
        # path-ignore-patterns excludes files `bun test` would otherwise glob but
        # that are not bun unit/integration tests: Playwright specs under e2e/ and
        # visual/ (different runner), the full-stack e2e package (needs a live
        # daemon), benchmark scripts, and compiled dist/ copies. Colocated
        # src/**/*.test.ts still run. Packages left with no applicable tests are
        # skipped (bun exits non-zero on a no-files-matched filter).
        run: |
          set -uo pipefail
          IGNORE=(
            --path-ignore-patterns='**/e2e/**'
            --path-ignore-patterns='**/visual/**'
            --path-ignore-patterns='**/dist/**'
            --path-ignore-patterns='**/scripts/bench*.test.ts'
          )
          # grep -c (not grep -q): under pipefail, grep -q exiting early SIGPIPEs the upstream grep on listings over ~8 KiB and the shard is silently skipped.
          has_tests() {
            find "$1" -name '*.test.ts' \
              -not -path '*/node_modules/*' -not -path '*/dist/*' \
              -not -path '*/e2e/*' -not -path '*/visual/*' 2>/dev/null \
              | grep -vE '/bench[^/]*\.test\.ts$' | grep -c . >/dev/null
          }
          failed=()
          for pkg in packages/*/; do
            pkg="${pkg%/}"
            if ! has_tests "$pkg"; then
              echo "skip ${pkg} (no applicable tests)"
              continue
            fi
            echo "::group::shard ${pkg}"
            bun scripts/bun-test-gate.ts "$pkg" "${IGNORE[@]}" || failed+=("$pkg")
            echo "::endgroup::"
          done
          echo "::group::shard root (test/ + scripts/)"
          bun scripts/bun-test-gate.ts --path-ignore-patterns='packages/**' "${IGNORE[@]}" || failed+=("root")
          echo "::endgroup::"
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::failing test shards: ${failed[*]}"
            exit 1
          fi
          echo "all test shards passed"
      - name: lint (advisory - whole-repo burn-down tracker, see strict-lint ratchet)
        # eslint over this many packages exceeds node's default ~2 GB heap and
        # dies with SIGABRT (exit 134) before reporting any findings.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run lint || true
        continue-on-error: true
      - name: lint:strict (BLOCKING - ratcheted packages must stay at eslint --max-warnings=0)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run lint:strict
