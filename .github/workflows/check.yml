name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          # Pinned to a known stable release — `latest` can resolve to a canary
          # build, which has surfaced NAPI-teardown panics (exit 133) under load.
          bun-version: 1.3.14
      - name: checkout @nova file-dependency (public sibling repo)
        # packages/core and packages/mcp depend on @nova/* via
        # file:../../../nova/packages/..., which resolves to a SIBLING of this
        # checkout (<workspace>/../nova). Without it, `bun install
        # --frozen-lockfile` fails to link the two @nova packages (ENOENT) and the
        # whole job dies before typecheck/test ever run. nova is public, so the
        # clone needs no token. Tracks nova main; pin a SHA here if reproducibility
        # against a specific nova revision becomes necessary.
        run: git clone --depth 1 https://github.com/frozename/nova.git ../nova
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        # Wrapper gates on reported pass/fail, not the raw exit code, to tolerate a
        # known upstream bun NAPI-teardown panic (exit 133 after a clean summary).
        # Real failures / load errors / pre-summary crashes still fail. See the script.
        #
        # path-ignore-patterns excludes files that `bun test` would otherwise glob
        # but that are not bun unit/integration tests: Playwright specs under e2e/
        # and visual/ (different runner — they error on load under bun), the
        # full-stack e2e package (needs a live daemon), benchmark scripts, and any
        # compiled dist/ copies. Colocated src/**/*.test.ts still run.
        run: >-
          bun scripts/bun-test-gate.ts
          --path-ignore-patterns='**/e2e/**'
          --path-ignore-patterns='**/visual/**'
          --path-ignore-patterns='**/dist/**'
          --path-ignore-patterns='**/scripts/bench*.test.ts'
      - name: lint (advisory - currently has known violations, see plan Phase 5.2)
        run: bun run lint || true
        continue-on-error: true
