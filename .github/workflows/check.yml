name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Raised from 15 on 2026-09-04, when packages/e2e joined the sharded test
    # step. Measured: the first run carrying the e2e shard took 871s against a
    # 900s limit -- 29s of headroom. Runs without it had ranged 566-798s, so a
    # slow runner plus the ~150s e2e shard would have exceeded 900s and failed
    # as an opaque job timeout rather than a named test failure.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          # Pinned to a known stable release — `latest` can resolve to a canary
          # build, which has surfaced NAPI-teardown panics (exit 133) under load.
          bun-version: 1.3.14
      - name: install ripgrep
        # The fs_grep feature (packages/daemon/src/fs-search.ts) shells out to
        # `rg`, and an import-guard test greps source via `rg`. ripgrep is not
        # preinstalled on the runner, so without this those suites fail to spawn.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: "typecheck coverage ratchet (blocking: floors fall, never rise)"
        # bun run typecheck is `tsc --build`, which is SILENT on roughly 40% of
        # this repo's TypeScript -- including most test files. This ratchet is the
        # instrument that measures the hole and fences it. It ran in NO CI step
        # until 2026-09-04, so the floors could drift unnoticed.
        # Never fix a failure here by raising a floor or relaxing a strictness
        # flag: that strips coverage from src/ and is worse than the bug.
        run: bun scripts/check-typecheck-coverage.ts
      - name: "console (blocking: unit + build)"
        run: |
          bun scripts/bun-test-gate.ts packages/console --path-ignore-patterns='**/console/e2e/**' --path-ignore-patterns='**/visual/**' --path-ignore-patterns='**/dist/**'
          bun run --cwd packages/console build
      - name: "test (blocking: sharded per package)"
        # Blocking: every shard runs green on the Linux runner since the
        # test-tail fixes of 2026-09-02 (hermetic git fixtures for the depth-1
        # checkout, no dbstat, platform-independent size/time/stat/readdir
        # assumptions, root workspace devDependencies for imports outside
        # packages/). A red shard fails the run. install, typecheck and
        # lint:strict remain hard gates alongside this step.
        #
        # Sharded: each package's tests run in their OWN bun process, plus a final
        # shard for non-package tests (root test/, scripts/). Per-package processes
        # isolate any single crash and keep the per-run logs readable. Each shard
        # goes through scripts/bun-test-gate.ts, which streams the child's output
        # (spawnSync's 1 MiB pipe buffer used to kill the daemon and core shards
        # before their summary) and gates on reported pass/fail, tolerating the
        # known post-summary NAPI-teardown panic (exit 133) only when 0 failures.
        #
        # path-ignore-patterns excludes files `bun test` would otherwise glob but
        # that are not bun unit/integration tests: Playwright specs under
        # packages/console/e2e/ and visual/ (different runner), benchmark
        # scripts, and compiled dist/ copies. Colocated src/**/*.test.ts still
        # run. Packages left with no applicable tests are skipped (bun exits
        # non-zero on a no-files-matched filter).
        #
        # This was the blanket pattern `**/e2e/**` until 2026-09-04. It also
        # darkened packages/e2e (15 files) and
        # packages/agentchat/test/e2e/handoff-roundtrip.test.ts, neither of which
        # ran in ANY CI shard -- packages/e2e went unnoticed-broken for ~3.5
        # months as a result. The stated reason, that the full-stack e2e package
        # "needs a live daemon", was wrong: those suites mkdtemp a sandbox and
        # spawn their own daemon per test. Keep this pattern narrow.
        run: |
          set -uo pipefail
          IGNORE=(
            --path-ignore-patterns='**/console/e2e/**'
            --path-ignore-patterns='**/visual/**'
            --path-ignore-patterns='**/dist/**'
            --path-ignore-patterns='**/scripts/bench*.test.ts'
          )
          # grep -c (not grep -q): under pipefail, grep -q exiting early SIGPIPEs the upstream grep on listings over ~8 KiB and the shard is silently skipped.
          has_tests() {
            find "$1" -name '*.test.ts' \
              -not -path '*/node_modules/*' -not -path '*/dist/*' \
              -not -path '*/console/e2e/*' -not -path '*/visual/*' 2>/dev/null \
              | grep -vE '/bench[^/]*\.test\.ts$' | grep -c . >/dev/null
          }
          failed=()
          for pkg in packages/*/; do
            pkg="${pkg%/}"
            if ! has_tests "$pkg"; then
              echo "skip ${pkg} (no applicable tests)"
              continue
            fi
            echo "::group::shard ${pkg}"
            bun scripts/bun-test-gate.ts "$pkg" "${IGNORE[@]}" || failed+=("$pkg")
            echo "::endgroup::"
          done
          echo "::group::shard root (test/ + scripts/)"
          bun scripts/bun-test-gate.ts --path-ignore-patterns='packages/**' "${IGNORE[@]}" || failed+=("root")
          echo "::endgroup::"
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::failing test shards: ${failed[*]}"
            exit 1
          fi
          echo "all test shards passed"
      - name: lint (advisory - whole-repo burn-down tracker, see strict-lint ratchet)
        # eslint over this many packages exceeds node's default ~2 GB heap and
        # dies with SIGABRT (exit 134) before reporting any findings.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run lint || true
        continue-on-error: true
      - name: lint:strict (BLOCKING - ratcheted packages must stay at eslint --max-warnings=0)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run lint:strict
