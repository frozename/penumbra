name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          # Pinned to a known stable release — `latest` can resolve to a canary
          # build, which has surfaced NAPI-teardown panics (exit 133) under load.
          bun-version: 1.3.14
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        # Wrapper gates on reported pass/fail, not the raw exit code, to tolerate a
        # known upstream bun NAPI-teardown panic (exit 133 after a clean summary).
        # Real failures / load errors / pre-summary crashes still fail. See the script.
        run: bun scripts/bun-test-gate.ts
      - name: lint (advisory - currently has known violations, see plan Phase 5.2)
        run: bun run lint || true
        continue-on-error: true
